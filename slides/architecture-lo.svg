<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Noto Sans Lao','Noto Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbfefe"/><stop offset="0.5" stop-color="#f0fafc"/><stop offset="1" stop-color="#e7f6fa"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11998f"/><stop offset="1" stop-color="#0a7a73"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#104655" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7a73"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8b93"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>

  <text x="80" y="90" font-size="46" font-weight="800" fill="#14222a">ສຽງເຕືອນ ເຮັດວຽກແນວໃດ?</text>
  <text x="80" y="136" font-size="24" fill="#4a5a63">ໂທລະສັບຈະຟັງສຽງອ້ອມຂ້າງແທນທ່ານ ແລະ ເຕືອນເມື່ອມີສຽງສຳຄັນ</text>

  <!-- 1. ມີສຽງເກີດຂຶ້ນ -->
  <g filter="url(#soft)">
    <rect x="80" y="300" width="210" height="200" rx="26" fill="#ffffff"/>
  </g>
  <g stroke="#0a7a73" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M140 388 a34 34 0 0 1 0 48"/><path d="M124 376 a52 52 0 0 1 0 72"/>
    <path d="M230 388 a34 34 0 0 0 0 48"/><path d="M246 376 a52 52 0 0 0 0 72"/>
  </g>
  <circle cx="185" cy="412" r="21" fill="url(#teal)"/>
  <text x="185" y="476" font-size="23" font-weight="700" fill="#14222a" text-anchor="middle">ມີສຽງເກີດຂຶ້ນ</text>

  <path d="M300 400 H 356" stroke="#0a7a73" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 2. ທຸກຢ່າງໃນກອບນີ້ ເກີດຂຶ້ນໃນເຄື່ອງ -->
  <rect x="368" y="196" width="860" height="430" rx="34" fill="#ffffff" fill-opacity="0.78" stroke="#0a7a73" stroke-width="3" stroke-dasharray="12 9"/>
  <rect x="368" y="196" width="372" height="46" rx="23" fill="#0a7a73"/>
  <text x="396" y="227" font-size="20" font-weight="700" fill="#ffffff">ຢູ່ໃນໂທລະສັບຂອງທ່ານ — ບໍ່ໃຊ້ອິນເຕີເນັດ</text>

  <g font-size="20" fill="#14222a">
    <g filter="url(#soft)"><rect x="398" y="288" width="252" height="262" rx="22" fill="#ffffff"/></g>
    <text x="524" y="332" font-size="19" font-weight="800" fill="#0a7a73" text-anchor="middle">1 · ຟັງ</text>
    <text x="524" y="382" font-weight="700" text-anchor="middle">ສຽງຈາກໄມໂຄຣໂຟນ</text>
    <text x="524" y="416" font-weight="700" text-anchor="middle">ຖືກຕັດເປັນທ່ອນ</text>
    <text x="524" y="450" font-weight="700" text-anchor="middle">10 ທ່ອນຕໍ່ວິນາທີ</text>
    <text x="524" y="504" font-size="18" fill="#4a5a63" text-anchor="middle">ບໍ່ເກັບບັນທຶກສຽງໄວ້</text>

    <g filter="url(#soft)"><rect x="672" y="288" width="252" height="262" rx="22" fill="#ffffff"/></g>
    <text x="798" y="332" font-size="19" font-weight="800" fill="#0a7a73" text-anchor="middle">2 · ຈື່ສຽງ</text>
    <text x="798" y="382" font-weight="700" text-anchor="middle">ທຽບກັບສຽງປະຈຳວັນ</text>
    <text x="798" y="416" font-weight="700" text-anchor="middle">40 ຊະນິດ</text>
    <text x="798" y="450" font-size="18" font-weight="700" text-anchor="middle">ແກລົດ · ໄຊເຣນ · ເດັກນ້ອຍ</text>
    <text x="798" y="504" font-size="18" fill="#4a5a63" text-anchor="middle">ໃຊ້ໂມເດລສຳເລັດຮູບ</text>

    <g filter="url(#soft)"><rect x="946" y="288" width="252" height="262" rx="22" fill="#ffffff"/></g>
    <text x="1072" y="332" font-size="19" font-weight="800" fill="#0a7a73" text-anchor="middle">3 · ຕັດສິນ</text>
    <text x="1072" y="382" font-weight="700" text-anchor="middle">ຮີບດ່ວນປານໃດ?</text>
    <text x="1072" y="422" font-size="21" font-weight="700" fill="#b3140f" text-anchor="middle">ອັນຕະລາຍ</text>
    <text x="1072" y="458" font-size="21" font-weight="700" fill="#8a5300" text-anchor="middle">ລະວັງ</text>
    <text x="1072" y="494" font-size="21" font-weight="700" fill="#1f5fbf" text-anchor="middle">ຂໍ້ມູນ</text>
  </g>

  <path d="M656 413 H 666" stroke="#0a7a73" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M930 413 H 940" stroke="#0a7a73" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1236 400 H 1288" stroke="#0a7a73" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 3. ການເຕືອນ -->
  <g filter="url(#soft)"><rect x="1296" y="268" width="224" height="290" rx="26" fill="#ffffff"/></g>
  <rect x="1336" y="300" width="144" height="150" rx="20" fill="#fde3e1"/>
  <circle cx="1408" cy="352" r="22" fill="#b3140f"/>
  <g stroke="#b3140f" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M1366 334 a28 28 0 0 0 0 36"/><path d="M1450 334 a28 28 0 0 1 0 36"/>
  </g>
  <text x="1408" y="420" font-size="20" font-weight="800" fill="#b3140f" text-anchor="middle">ມີສຽງແກລົດ</text>
  <text x="1408" y="494" font-size="22" font-weight="700" fill="#14222a" text-anchor="middle">ທ່ານເຫັນ</text>
  <text x="1408" y="528" font-size="22" font-weight="700" fill="#14222a" text-anchor="middle">ແລະ ຮູ້ສຶກມັນສັ່ນ</text>

  <!-- ເວລາ -->
  <path d="M185 592 H 1408" stroke="#0a7a73" stroke-width="2.5" stroke-dasharray="7 7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="633" y="566" width="330" height="54" rx="27" fill="url(#teal)"/>
  <text x="798" y="603" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">186 ມິນລິວິນາທີ ຈົນເຖິງສັ່ນ</text>
  <text x="798" y="648" font-size="20" fill="#4a5a63" text-anchor="middle">ໄວກວ່າຄົນຫັນຫົວໄປເບິ່ງ</text>

  <!-- ການຕິດຕໍ່ເຄືອຂ່າຍພຽງຢ່າງດຽວ -->
  <path d="M1072 558 V 706 H 1138" stroke="#7b8b93" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowGrey)"/>
  <g filter="url(#soft)"><rect x="1150" y="662" width="370" height="142" rx="22" fill="#ffffff" fill-opacity="0.85"/></g>
  <text x="1176" y="700" font-size="18" font-weight="800" fill="#4a5a63">ສະເພາະເມື່ອທ່ານກົດເທົ່ານັ້ນ</text>
  <text x="1176" y="732" font-size="18" fill="#14222a">ປຸ່ມ “ເກີດຫຍັງຂຶ້ນ?” ຈະສົ່ງຂໍ້ຄວາມ</text>
  <text x="1176" y="762" font-size="18" fill="#14222a">ສັ້ນໆ ອອກໄປ ເພື່ອຂໍຄຳອະທິບາຍງ່າຍໆ</text>
  <text x="1176" y="792" font-size="18" fill="#14222a">ບໍ່ເຄີຍສົ່ງສຽງອອກໄປຈັກເທື່ອ</text>

  <!-- ຄຳໝັ້ນສັນຍາ -->
  <rect x="80" y="662" width="1050" height="142" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#0a7a73" stroke-width="2"/>
  <text x="116" y="704" font-size="21" font-weight="800" fill="#0a7a73">ນີ້ໝາຍຄວາມວ່າແນວໃດ</text>
  <text x="116" y="744" font-size="20" fill="#14222a">ສຽງບໍ່ເຄີຍອອກຈາກໂທລະສັບ. ບໍ່ຕ້ອງສະໝັກບັນຊີ, ບໍ່ຕ້ອງໂຫຼດແອັບ, ບໍ່ຕ້ອງເສຍຄ່າອິນເຕີເນັດ —</text>
  <text x="116" y="780" font-size="20" fill="#14222a">ເປີດພຽງລິ້ງດຽວໃນບຣາວເຊີ. ຫຼັງຈາກເປີດຄັ້ງທຳອິດແລ້ວ ມັນຍັງໃຊ້ໄດ້ ເຖິງວ່າຈະປິດອິນເຕີເນັດ.</text>
</svg>
